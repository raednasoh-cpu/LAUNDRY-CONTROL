name: Build Laundry Control

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FIREBASE_JS: "10.14.1"

jobs:
  android:
    name: Android app (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Firebase library to the app
        run: |
          mkdir -p app/src/main/assets/www/js
          for f in app auth firestore; do
            curl -fsSL -o app/src/main/assets/www/js/firebase-$f-compat.js \
              https://www.gstatic.com/firebasejs/${FIREBASE_JS}/firebase-$f-compat.js
          done

      - name: Restore the shop signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then
            echo "::error::The ANDROID_KEYSTORE secret is missing. See SETUP.md, step 3."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE" | base64 -d > app/laundry.keystore

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "LaundryControl-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: LaundryControl-APK
          path: LaundryControl-*.apk

      - name: Publish download on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Laundry Control 1.0.${{ github.run_number }}
          body: "Download the .apk file below on your Android phone and open it to install or update."
          files: LaundryControl-*.apk
          make_latest: true

  laptop:
    name: Laptop version (GitHub Pages)
    runs-on: ubuntu-latest
    # Needs Pages turned on (Settings → Pages → Source: GitHub Actions).
    # Private repositories need a paid GitHub plan for Pages; the APK build does not depend on this.
    continue-on-error: true
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Add Firebase library
        run: |
          mkdir -p app/src/main/assets/www/js
          for f in app auth firestore; do
            curl -fsSL -o app/src/main/assets/www/js/firebase-$f-compat.js \
              https://www.gstatic.com/firebasejs/${FIREBASE_JS}/firebase-$f-compat.js
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/src/main/assets/www
      - uses: actions/deploy-pages@v4
